<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Promoteur des Établissements Privés</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --blue: #1565C0;
            --blue-dark: #0D47A1;
            --gray-100: #f0f1f3;
            --gray-200: #e2e4e8;
            --dark: #0f1419;
            --white: #fff;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--gray-100);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark);
        }

        .login-card {
            background: var(--white);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            width: 64px;
            height: 64px;
            background: var(--blue);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .logo svg {
            width: 32px;
            height: 32px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        p {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: 500;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--dark);
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--blue);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--blue);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-family: inherit;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        button:hover {
            background: var(--blue-dark);
        }

        .error-msg {
            color: #d32f2f;
            font-size: 0.85rem;
            margin-top: 16px;
            display: none;
        }

        .back-link {
            display: block;
            margin-top: 24px;
            color: #6b7280;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .back-link:hover {
            color: var(--dark);
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="logo">
            <svg viewBox="0 0 24 24">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
        </div>
        <h1>Administration</h1>
        <p>Connectez-vous pour accéder au tableau de bord.</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="admin@example.com" value="admin@example.com" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" value="admin" required>
            </div>
            <button type="submit">Se connecter</button>
            <div class="error-msg" id="errorMsg">Identifiants incorrects</div>
        </form>

        <a href="promotionproject.html" class="back-link">← Retour au site</a>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            // Simulated Auth
            if (email === 'admin@example.com' && password === 'admin') {
                // Success
                button = document.querySelector('button');
                button.innerHTML = 'Connexion...';
                button.style.background = '#0D47A1';
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 800);
            } else {
                // Error
                errorMsg.style.display = 'block';
                document.getElementById('password').value = '';
                // Shake effect styling could be added here
            }
        }
    </script>
</body>

</html>
